name: Refresh IBQT snapshot

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-ibqt-snapshot
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5

      - name: Download sanitized snapshot
        run: |
          curl --fail --silent --show-error \
            --retry 3 \
            https://s3.ap-northeast-1.amazonaws.com/ibqt-readonly-458137374613-apne1/latest.json \
            --output latest.json.new

      - name: Validate privacy and JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("latest.json.new")
          data = json.loads(path.read_text())
          serialized = path.read_text()
          forbidden = ('"accounts"', '"command"', '"client_id"', '"logs"')
          found = [key for key in forbidden if key in serialized]
          if found:
              raise SystemExit(f"refusing to publish sensitive fields: {found}")
          if data.get("source") != "IBQT read-only snapshot":
              raise SystemExit("unexpected snapshot source")
          path.replace("latest.json")
          PY

      - name: Publish when changed
        run: |
          if git diff --quiet -- latest.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json
          git commit -m "refresh snapshot"
          git push
